name: Build public GUI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gui-build.yml"
      - "gui-source/**"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/gui-build.yml"
      - "gui-source/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: "Release tag providing the prebuilt public runtime"
        required: true
        default: "v0.2.4-beta.2"
        type: string

permissions:
  contents: read

concurrency:
  group: public-gui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNTIME_TAG: ${{ inputs.runtime_tag || 'v0.2.4-beta.2' }}
  GPU_SHARK_FEEDBACK_HOST: ${{ github.event_name != 'pull_request' && secrets.GPU_SHARK_FEEDBACK_HOST || 'feedback.invalid' }}
  GPU_SHARK_FEEDBACK_PATH: ${{ github.event_name != 'pull_request' && secrets.GPU_SHARK_FEEDBACK_PATH || '/disabled' }}
  GPU_SHARK_EMBED_PUBLIC_RUNTIME: "1"

jobs:
  build:
    name: Windows x64 GUI
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt
          rustc --version
          cargo --version

      - name: Download and verify public runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP "gpu-shark-runtime-assets"
          New-Item -ItemType Directory -Path $assetDirectory | Out-Null

          gh release download $env:RUNTIME_TAG `
            --repo "${{ github.repository }}" `
            --pattern "GPU-Shark-gui-runtime-win-x64.zip" `
            --pattern "SHA256SUMS.txt" `
            --dir $assetDirectory

          $archiveName = "GPU-Shark-gui-runtime-win-x64.zip"
          $archivePath = Join-Path $assetDirectory $archiveName
          $checksumPath = Join-Path $assetDirectory "SHA256SUMS.txt"
          $checksumLine = Get-Content -LiteralPath $checksumPath |
            Where-Object { $_ -match "^[0-9A-Fa-f]{64}  $([regex]::Escape($archiveName))$" } |
            Select-Object -First 1
          if (-not $checksumLine) {
            throw "Runtime archive is absent from SHA256SUMS.txt"
          }
          $expected = ($checksumLine -split "  ", 2)[0].ToUpperInvariant()
          $actual = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "Runtime archive checksum mismatch"
          }

          $payloadDirectory = Join-Path $env:RUNNER_TEMP "GPU-Shark-public-runtime"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $payloadDirectory
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GPU_SHARK_PUBLIC_PAYLOAD_DIR=$payloadDirectory"

      - name: Remap local Rust build paths
        shell: pwsh
        run: |
          $separator = [char]0x1f
          $flags = @(
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=/src",
            "--remap-path-prefix=$env:USERPROFILE=/user"
          )
          $encoded = [string]::Join($separator, $flags)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_ENCODED_RUSTFLAGS=$encoded"

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --manifest-path .\gui-source\Cargo.toml -- --check

      - name: Check public GUI
        shell: pwsh
        run: cargo check --manifest-path .\gui-source\Cargo.toml --locked

      - name: Build public GUI
        shell: pwsh
        run: cargo build --manifest-path .\gui-source\Cargo.toml --release --locked

      - name: Assemble standalone CI package
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "GPU-Shark-ci-win-x64"
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item -LiteralPath ".\gui-source\target\release\gpu-shark-gui.exe" `
            -Destination (Join-Path $bundle "GPU-Shark.exe")
          Copy-Item -LiteralPath (Join-Path $env:GPU_SHARK_PUBLIC_PAYLOAD_DIR "LICENSE") -Destination $bundle
          Copy-Item -LiteralPath (Join-Path $env:GPU_SHARK_PUBLIC_PAYLOAD_DIR "THIRD_PARTY_NOTICES.md") -Destination $bundle
          Copy-Item -LiteralPath (Join-Path $env:GPU_SHARK_PUBLIC_PAYLOAD_DIR "README.txt") -Destination $bundle
          Copy-Item -LiteralPath (Join-Path $env:GPU_SHARK_PUBLIC_PAYLOAD_DIR "LICENSES") -Destination $bundle -Recurse

          @(
            "GUI commit: ${{ github.sha }}"
            "Runtime tag: $env:RUNTIME_TAG"
            "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ) | Set-Content -LiteralPath (Join-Path $bundle "BUILD_INFO.txt") -Encoding utf8

          $required = @("GPU-Shark.exe", "LICENSE", "THIRD_PARTY_NOTICES.md", "README.txt", "LICENSES")
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $name))) {
              throw "Packaged artifact is missing $name"
            }
          }
          if (Get-ChildItem -LiteralPath $bundle -Recurse -Filter "*.pdb") {
            throw "Debug symbols must not be uploaded"
          }
          if (Get-ChildItem -LiteralPath $bundle -Recurse -Filter "*.dll") {
            throw "Standalone CI package must not contain adjacent DLLs"
          }

          $publicExe = Join-Path $bundle "GPU-Shark.exe"
          $bytes = [System.IO.File]::ReadAllBytes($publicExe)
          $ascii = [System.Text.Encoding]::Latin1.GetString($bytes)
          $unicode = [System.Text.Encoding]::Unicode.GetString($bytes)
          $forbidden = @(
            "GPU UUID",
            $env:GITHUB_WORKSPACE,
            $env:USERPROFILE,
            $env:COMPUTERNAME
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          foreach ($marker in $forbidden) {
            if ($ascii.Contains($marker) -or $unicode.Contains($marker)) {
              throw "Public executable contains a forbidden privacy marker"
            }
          }
          foreach ($marker in @("requireAdministrator", "PerMonitorV2", "gs.dll", "gsn.dll")) {
            if (-not ($ascii.Contains($marker) -or $unicode.Contains($marker))) {
              throw "Public executable is missing a required package marker"
            }
          }

      - name: Upload CI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GPU-Shark-ci-win-x64-${{ github.run_number }}
          path: ${{ runner.temp }}\GPU-Shark-ci-win-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
